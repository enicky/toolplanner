apiVersion: v1
kind: Service
metadata:
  name: {{ include "tool-planner.fullname" . }}-web
  labels:
    {{- include "tool-planner.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tool-planner.fullname" . }}-web
  labels:
    {{- include "tool-planner.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext.web | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TOOLPLANNER_API_UPSTREAM
              value: {{ printf "%s-api:%v" (include "tool-planner.fullname" .) .Values.service.api.port | quote }}
            {{- with .Values.web.dnsResolver }}
            - name: TOOLPLANNER_DNS_RESOLVER
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
