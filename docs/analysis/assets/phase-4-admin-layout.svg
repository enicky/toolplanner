<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 1360 800" role="img" aria-labelledby="title description">
  <title id="title">Tool Planner admin sidebar and separate pages</title>
  <desc id="description">A desktop admin dashboard with a persistent left sidebar listing Overview, Inventory, Current loans, Reservations, Users, Locations and departments, Reservation rules, Reports, and Audit activity. A mobile preview shows the navigation collapsed behind an accessible menu button.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#392078"/>
      <stop offset="1" stop-color="#7054d8"/>
    </linearGradient>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #fff; }
      .sub { font: 15px Arial, sans-serif; fill: #e9e3ff; }
      .brand { font: 700 15px Arial, sans-serif; fill: #38266d; }
      .nav { font: 14px Arial, sans-serif; fill: #554f68; }
      .navActive { font: 700 14px Arial, sans-serif; fill: #49308b; }
      .section { font: 700 10px Arial, sans-serif; fill: #898397; letter-spacing: 1.1px; }
      .pageTitle { font: 700 24px Arial, sans-serif; fill: #302352; }
      .copy { font: 14px Arial, sans-serif; fill: #6a6576; }
      .metric { font: 700 25px Arial, sans-serif; fill: #39266f; }
      .metricLabel { font: 12px Arial, sans-serif; fill: #756f82; }
      .cardTitle { font: 700 14px Arial, sans-serif; fill: #40365d; }
      .small { font: 12px Arial, sans-serif; fill: #6e687b; }
      .frame { fill: #fff; stroke: #ddd8e9; stroke-width: 1.5; }
      .side { fill: #fff; stroke: #e8e4ef; stroke-width: 1; }
      .active { fill: #f0ecfa; }
      .card { fill: #fff; stroke: #e8e4ef; stroke-width: 1.2; }
      .mobile { fill: #fff; stroke: #bfb7d2; stroke-width: 2; }
      .line { stroke: #ece9f2; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1360" height="800" rx="22" fill="#faf9fd"/>
  <path d="M22 0 H1338 Q1360 0 1360 22 V112 H0 V22 Q0 0 22 0" fill="url(#header)"/>
  <text x="48" y="52" class="title">Tool Planner | A calmer admin workspace</text>
  <text x="48" y="81" class="sub">One task per page • persistent navigation • responsive on desktop, phone, and iPad</text>

  <!-- Desktop application frame -->
  <rect x="42" y="143" width="930" height="605" rx="18" class="frame"/>
  <path d="M60 143 H954 Q972 143 972 161 V194 H42 V161 Q42 143 60 143" fill="#fff"/>
  <circle cx="66" cy="169" r="5" fill="#e0dbea"/>
  <circle cx="84" cy="169" r="5" fill="#e0dbea"/>
  <circle cx="102" cy="169" r="5" fill="#e0dbea"/>
  <text x="132" y="174" class="small">Admin workspace · /admin/overview</text>
  <line x1="42" y1="194" x2="972" y2="194" class="line"/>

  <rect x="43" y="195" width="235" height="552" class="side"/>
  <circle cx="70" cy="229" r="15" fill="#4a2d96"/>
  <text x="66" y="234" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">T</text>
  <text x="95" y="225" class="brand">Tool Planner</text>
  <text x="95" y="243" class="small">Geel site</text>

  <rect x="56" y="268" width="208" height="34" rx="8" class="active"/>
  <text x="72" y="290" class="navActive">Overview</text>
  <text x="72" y="326" class="section">OPERATIONS</text>
  <text x="72" y="353" class="nav">Inventory</text>
  <text x="72" y="384" class="nav">Current loans</text>
  <text x="72" y="415" class="nav">Reservations</text>
  <text x="72" y="453" class="section">ADMINISTRATION</text>
  <text x="72" y="480" class="nav">Users</text>
  <text x="72" y="511" class="nav">Locations &amp; departments</text>
  <text x="72" y="542" class="nav">Reservation rules</text>
  <text x="72" y="580" class="section">INSIGHTS</text>
  <text x="72" y="607" class="nav">Reports</text>
  <text x="72" y="638" class="nav">Audit activity</text>
  <line x1="58" y1="672" x2="263" y2="672" class="line"/>
  <text x="72" y="701" class="small">Signed in as Admin</text>
  <text x="72" y="722" class="small">Account · Sign out</text>

  <text x="308" y="238" class="section">OVERVIEW</text>
  <text x="308" y="274" class="pageTitle">Equipment at a glance</text>
  <text x="308" y="300" class="copy">Today at Geel · Europe/Brussels</text>

  <rect x="308" y="324" width="190" height="106" rx="13" class="card"/>
  <text x="328" y="357" class="metric">12</text>
  <text x="328" y="385" class="metricLabel">Elevators available</text>
  <text x="328" y="408" class="small">Across active inventory</text>
  <rect x="514" y="324" width="190" height="106" rx="13" class="card"/>
  <text x="534" y="357" class="metric">4</text>
  <text x="534" y="385" class="metricLabel">Currently in custody</text>
  <text x="534" y="408" class="small">Open custody records</text>
  <rect x="720" y="324" width="220" height="106" rx="13" class="card"/>
  <text x="740" y="357" class="metric">2</text>
  <text x="740" y="385" class="metricLabel">Reservations at risk</text>
  <text x="740" y="408" class="small">Needs administrator attention</text>

  <rect x="308" y="451" width="400" height="250" rx="13" class="card"/>
  <text x="330" y="484" class="cardTitle">Reservations needing attention</text>
  <text x="330" y="514" class="small">LIFT-004 · not yet physically returned</text>
  <text x="330" y="536" class="small">Reservation starts today at 10:30</text>
  <line x1="330" y1="552" x2="684" y2="552" class="line"/>
  <text x="330" y="580" class="small">LIFT-008 · blocked by administrator</text>
  <text x="330" y="602" class="small">Owner alerted in-app on next login</text>
  <text x="330" y="663" class="navActive">View all reservations →</text>

  <rect x="724" y="451" width="216" height="250" rx="13" class="card"/>
  <text x="746" y="484" class="cardTitle">Longest loan age</text>
  <text x="746" y="526" class="metric">2d 4h</text>
  <text x="746" y="552" class="small">LIFT-002</text>
  <text x="746" y="612" class="small">Age only; no overdue</text>
  <text x="746" y="632" class="small">threshold configured yet</text>
  <text x="746" y="672" class="navActive">View current loans →</text>

  <!-- Mobile navigation pattern -->
  <text x="1032" y="157" class="section">PHONE / IPAD</text>
  <rect x="1018" y="177" width="292" height="545" rx="30" class="mobile"/>
  <rect x="1030" y="198" width="268" height="505" rx="20" fill="#f7f6fb"/>
  <rect x="1030" y="198" width="268" height="65" rx="20" fill="#fff"/>
  <text x="1050" y="227" class="brand">Tool Planner</text>
  <text x="1050" y="246" class="small">Geel · Admin</text>
  <rect x="1247" y="214" width="35" height="35" rx="9" fill="#f0ecfa"/>
  <path d="M1256 224 H1273 M1256 231 H1273 M1256 238 H1273" stroke="#4b328e" stroke-width="2" stroke-linecap="round"/>
  <text x="1050" y="298" class="section">OVERVIEW</text>
  <text x="1050" y="330" class="pageTitle" font-size="18">Equipment at a glance</text>
  <rect x="1050" y="350" width="228" height="78" rx="12" class="card"/>
  <text x="1067" y="380" class="metric" font-size="21">12 available</text>
  <text x="1067" y="405" class="metricLabel">4 in custody · 2 at risk</text>
  <rect x="1050" y="445" width="228" height="122" rx="12" class="card"/>
  <text x="1067" y="474" class="cardTitle">Needs attention</text>
  <text x="1067" y="500" class="small">LIFT-004 · reservation at risk</text>
  <text x="1067" y="522" class="small">LIFT-008 · blocked</text>
  <text x="1067" y="550" class="navActive">View reservations →</text>
  <rect x="1050" y="585" width="228" height="44" rx="10" fill="#4b2f99"/>
  <text x="1112" y="613" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Open navigation</text>
  <text x="1050" y="661" class="small">Drawer traps/restores focus and</text>
  <text x="1050" y="681" class="small">closes after choosing a destination.</text>
</svg>
