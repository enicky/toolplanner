<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title description">
  <title id="title">Proposed Tool Planner reports overview</title>
  <desc id="description">A desktop dashboard concept with date filters, four aggregate metric cards, a checkout trend, elevator usage ranking, custody age bands, and reservation outcomes. All values are illustrative.</desc>
