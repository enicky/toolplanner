name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Lint
        working-directory: backend
        run: uv run --frozen ruff check src tests migrations
      - name: Test
        working-directory: backend
        run: uv run --frozen pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --registry=https://registry.npmjs.org
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit dependencies
        working-directory: web
        run: npm audit --registry=https://registry.npmjs.org

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/tool-planner
      - name: Render chart
        run: helm template tool-planner deploy/helm/tool-planner --set ingress.host=tool-planner.example.test
